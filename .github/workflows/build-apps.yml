name: Build Android and iOS

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android tests and build APKs
        working-directory: android
        run: bash ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Record APK checksums
        run: |
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk \
                    android/app/build/outputs/apk/release/app-release.apk \
            > android-apk-sha256.txt

      - name: Upload Android APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tether-android-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
            android-apk-sha256.txt
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS unsigned build + Swift tests
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Print Xcode version
        run: xcodebuild -version

      - name: Run Swift package tests
        run: (cd ios/TetherCore && ./test.sh)

      - name: Generate iOS project
        working-directory: ios
        run: xcodegen generate

      - name: Build iOS app without code signing
        working-directory: ios
        run: |
          xcodebuild \
            -project Tether.xcodeproj \
            -scheme Tether \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-ci \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA for inspection only
        run: |
          app='ios/build-ci/Build/Products/Release-iphoneos/Tether.app'
          test -d "$app"
          mkdir -p ios/build-ci/package/Payload
          cp -R "$app" ios/build-ci/package/Payload/Tether.app
          (cd ios/build-ci/package && zip -qry ../Tether-UNSIGNED-NOT-INSTALLABLE.ipa Payload)
          shasum -a 256 ios/build-ci/Tether-UNSIGNED-NOT-INSTALLABLE.ipa > ios/build-ci/ios-sha256.txt

      - name: Upload unsigned iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: tether-ios-unsigned
          path: |
            ios/build-ci/Tether-UNSIGNED-NOT-INSTALLABLE.ipa
            ios/build-ci/ios-sha256.txt
          if-no-files-found: error
          retention-days: 14
