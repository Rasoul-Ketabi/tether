name: Publish Exynos Audio Test APK
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: >-
      github.repository == 'Rasoul-Ketabi/tether' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && startsWith(github.event.workflow_run.head_commit.message, 'Exynos native: live release')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: ${{ github.event.workflow_run.id }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Verify completed CI and retrieve existing Android host APK
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh run view "$SOURCE_RUN" --json headSha,status,conclusion --jq '.headSha + " " + .status + " " + .conclusion' | grep -Fx "$SOURCE_SHA completed success"
          gh run download "$SOURCE_RUN" --name tether-apks-debug-signed --dir downloaded
          mapfile -t apks < <(find downloaded -type f -name 'Tether-A54-*.apk')
          test "${#apks[@]}" -eq 1
          mkdir dist
          cp "${apks[0]}" "dist/Tether-Exynos-Live-Bridge-${SOURCE_SHA:0:7}-debug-signed.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - name: Publish verified Android APK
        shell: bash
        run: |
          set -euo pipefail
          TAG="exynos-live-bridge-${SOURCE_SHA:0:7}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "$SOURCE_SHA" --prerelease --title "Tether 1.2.5 – Exynos AP live bridge (experimental Android)" --notes "Android host APK from successful CI. Debug-signed. Root helper UID 0 required for device-specific diagnostics. Opt-in live 48 kHz AP PCM sample streaming and temporary mixer routing for rooted j7velte, with bounded I/O and restoration. Physical end-to-end voice routing is not validated. Read docs/EXYNOS-AP-BRIDGE.md before a controlled call. Existing iOS app remains compatible."
          fi
