name: Publish Hybrid Stability APK and unsigned IPA
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: >-
      github.repository == 'Rasoul-Ketabi/tether' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && startsWith(github.event.workflow_run.head_commit.message, 'Hybrid stability:')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: ${{ github.event.workflow_run.id }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Download verified CI artifacts
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh run view "$SOURCE_RUN" --json headSha,status,conclusion --jq '.headSha + " " + .status + " " + .conclusion' | grep -Fx "$SOURCE_SHA completed success"
          gh run download "$SOURCE_RUN" --name tether-apks-debug-signed --dir android-out
          gh run download "$SOURCE_RUN" --name tether-ios-unsigned --dir ios-out
          mapfile -t apks < <(find android-out -type f -name 'Tether-A54-*.apk')
          test "${#apks[@]}" -eq 1
          test -f ios-out/Tether-iOS-UNSIGNED.ipa
          mkdir dist
          cp "${apks[0]}" "dist/Tether-Hybrid-Stability-Android-${SOURCE_SHA:0:7}.apk"
          cp ios-out/Tether-iOS-UNSIGNED.ipa "dist/Tether-Hybrid-Stability-iOS-${SOURCE_SHA:0:7}-UNSIGNED.ipa"
          (cd dist && sha256sum *.apk *.ipa > SHA256SUMS.txt)
      - name: Publish experimental release
        shell: bash
        run: |
          set -euo pipefail
          TAG="hybrid-stability-${SOURCE_SHA:0:7}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "$SOURCE_SHA" --prerelease --title "Tether Hybrid Stability + Exynos Live Audio" --notes "Successful CI artifacts. Android debug-signed; iOS IPA UNSIGNED and must be signed before installation. BLE transport selection, stable priority/1M profile, temporary GATT preference after short sessions, authenticated LAN audio with BLE fallback. Exynos AP live audio retained. Physical-device hybrid tests not yet performed."
          fi
