name: Publish Root Helper Android Test APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-root-test.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: github.repository == 'Rasoul-Ketabi/tether'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: '46067832834'
      SOURCE_SHA: bd9d3617ac381e925007f62ba2b1f562063f0578
      TAG: root-helper-test-1.2.5-bd9d361
    steps:
      - name: Verify completed CI and retrieve existing APK
        shell: bash
        run: |
          set -euo pipefail
          gh run view "$SOURCE_RUN" --json headSha,status,conclusion --jq '.headSha + " " + .status + " " + .conclusion' | grep -Fx "$SOURCE_SHA completed success"
          gh run download "$SOURCE_RUN" --name tether-apks-debug-signed --dir downloaded
          mapfile -t apks < <(find downloaded -type f -name 'Tether-A54-*.apk')
          test "${#apks[@]}" -eq 1
          mkdir dist
          cp "${apks[0]}" dist/Tether-Root-Android-1.2.5-bd9d361-debug-signed.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - name: Publish Android-only prerelease
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "$SOURCE_SHA" --prerelease --title "Tether 1.2.5 – Experimental Magisk Root Helper (Android)" --notes "Android SIM-host APK from successful CI run 46067832834. Debug-signed; uninstall differently signed versions before installing. Select the experimental Magisk Root helper and verify UID 0. Call-audio compatibility on J7 Core is not yet validated. No iOS change in this build."
          fi
